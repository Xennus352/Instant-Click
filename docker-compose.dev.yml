# Development overrides for docker-compose.yml
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  # ============================================================
  # NGINX DEV OVERRIDES
  # ============================================================
  nginx:
    volumes:
      - ./nginx/conf.d/dev.conf:/etc/nginx/conf.d/default.conf:ro
    # No TLS in dev - HTTP only

  # ============================================================
  # NEXT.JS DEV OVERRIDES
  # ============================================================
  nextjs:
    command: npm run dev
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - WATCHPACK_POLLING=true  # For hot reload in Docker
      - S3_ENDPOINT=http://minio:9000
      - S3_PUBLIC_ENDPOINT=http://localhost:19002
      - S3_FORCE_PATH_STYLE=true
      # DINGER callback system (empty defaults - payment gate false by default)
      - DINGER_CALLBACKS_ENABLED=${DINGER_CALLBACKS_ENABLED:-false}
      - DINGER_CALLBACK_KEY=${DINGER_CALLBACK_KEY:-}
      - DINGER_API_KEY=${DINGER_API_KEY:-}
      - DINGER_PUBLIC_KEY=${DINGER_PUBLIC_KEY:-}
      - DINGER_PROJECT_KEY=${DINGER_PROJECT_KEY:-}
      - DINGER_MERCHANT_KEY=${DINGER_MERCHANT_KEY:-}
    # Source code bind-mounted for hot reload (already in base)
    # No resource limits in dev

  # ============================================================
  # MONGODB DEV OVERRIDES
  # ============================================================
  mongodb-primary:
    command: >
      mongod --replSet rs0 --bind_ip_all --port 27017
      --wiredTigerCacheSizeGB 0.5
      --oplogSize 64
      --quiet
    # Reduced resources for dev

  mongodb-secondary:
    command: >
      mongod --replSet rs0 --bind_ip_all --port 27017
      --wiredTigerCacheSizeGB 0.5
      --quiet

  # ============================================================
  # REDIS DEV OVERRIDES
  # ============================================================
  redis:
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --save ""

  # ============================================================
  # MinIO DEV OVERRIDES
  # ============================================================
  minio:
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_KEY:-minioadmin}

  # ============================================================
  # WORKERS DEV OVERRIDES (Milestone 5 - runs actual FastAPI apps)
  # ============================================================
  asr-worker:
    # Run actual FastAPI app; model availability reflected in /health and /ready
    # Model artifacts are populated by scripts/download-nara-models.sh in MODEL_CACHE_DIR.
    # If models missing, /health returns degraded and /ready returns 503
    # Model download/verification: scripts/download-nara-models.sh download-sar
    # License: Apache-2.0 (https://huggingface.co/YeeNyunn/nara-sar/blob/main/LICENSE)
    # Verify checksums: scripts/download-nara-models.sh verify
    volumes:
      - ${MODEL_CACHE_DIR:-./model_cache}:/models:ro

  tts-worker:
    # Run actual FastAPI app; model availability reflected in /health and /ready
    # Model artifacts are populated by scripts/download-nara-models.sh in MODEL_CACHE_DIR.
    # If models missing, /health returns degraded and /ready returns 503
    # Model download/verification: run scripts/download-nara-models.sh download-mini
    # License: Apache-2.0 (https://huggingface.co/YeeNyunn/nara-mini-v1/blob/main/LICENSE)
    # Verify checksums: scripts/download-nara-models.sh verify
    volumes:
      - ${MODEL_CACHE_DIR:-./model_cache}:/models:ro

  ai-worker:
    # Gemini is the only text-generation provider; readiness requires a valid model/key.
    # Speech work uses Nara SAR and Nara Mini only.

  render-worker:
    # Run actual FastAPI app; FFmpeg availability reflected in /health and /ready
    # Requires ffmpeg in PATH (installed in dev image)

  # Durable BullMQ consumers for the Milestone 5 stages.
  pipeline-worker:
    build:
      context: ./services/nextjs
      dockerfile: Dockerfile.dev
    container_name: instantcap-pipeline-worker
    command: npm run worker:pipeline
    working_dir: /app
    environment:
      - NODE_ENV=development
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin}
      - S3_BUCKET=${S3_BUCKET:-instantcap}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE:-true}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-}
      - PIPELINE_API_URL=http://nextjs:3000
      - FFMPEG_WORKER_URL=http://render-worker:8004
      - ASR_WORKER_URL=http://asr-worker:8001
      - AI_WORKER_URL=http://ai-worker:8003
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.8-flash}
      - PIPELINE_WORKER_CONCURRENCY=1
    volumes:
      - ./services/nextjs:/app
      - /app/node_modules
    depends_on:
      mongodb-primary:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      nextjs:
        condition: service_healthy
      render-worker:
        condition: service_started
      asr-worker:
        condition: service_started
      ai-worker:
        condition: service_started
    networks:
      - instantcap-network
    restart: unless-stopped

  # ============================================================
  # ADDITIONAL DEV TOOLS
  # ============================================================
