# Production Nginx Configuration for InstantCap
# TLS termination, strict security headers, rate limiting

upstream nextjs {
    least_conn;
    server nextjs-1:3000 max_fails=3 fail_timeout=10s;
    server nextjs-2:3000 max_fails=3 fail_timeout=10s;
    server nextjs-3:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream minio {
    least_conn;
    server minio-1:9000 max_fails=3 fail_timeout=30s;
    server minio-2:9000 max_fails=3 fail_timeout=30s;
    server minio-3:9000 max_fails=3 fail_timeout=30s;
    server minio-4:9000 max_fails=3 fail_timeout=30s;
    keepalive 16;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=upload:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=s3:10m rate=50r/s;

# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name instantcap.app www.instantcap.app;

    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name instantcap.app www.instantcap.app;

    # SSL certificates (managed by certbot)
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # SSL security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' wss:; frame-ancestors 'none';";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload";

    # Health check (no auth, no rate limit)
    location = /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Frontend - Next.js
    location / {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # WebSocket support
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # API Routes - Next.js API handlers
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Larger body for file uploads
        client_max_body_size 500M;

        # Longer timeout for processing endpoints
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Upload endpoint (stricter rate limit)
    location /api/upload {
        limit_req zone=upload burst=5 nodelay;
        client_max_body_size 500M;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # S3-compatible object storage API (for direct browser uploads via presigned URLs)
    # Rate limited, CORS handled by MinIO bucket config + nginx fallback
    location /s3/ {
        limit_req zone=s3 burst=20 nodelay;

        # Handle CORS preflight
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin $http_origin;
            add_header Access-Control-Allow-Methods "GET, PUT, POST, DELETE, HEAD, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Content-Length, Content-MD5, X-Amz-*, X-Requested-With";
            add_header Access-Control-Max-Age 3600;
            add_header Access-Control-Expose-Headers "ETag, Content-Length, Content-Type";
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        proxy_pass http://minio/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pass through CORS headers from MinIO
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        add_header Access-Control-Allow-Origin $http_origin;
        add_header Access-Control-Allow-Methods "GET, PUT, POST, DELETE, HEAD, OPTIONS";
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Content-Length, Content-MD5, X-Amz-*, X-Requested-With";
        add_header Access-Control-Expose-Headers "ETag, Content-Length, Content-Type";

        # Larger body for direct uploads
        client_max_body_size 2G;

        # Longer timeouts for large file uploads
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
    }

    # MinIO Console (admin only - restrict by IP or auth)
    location /minio-console/ {
        # Restrict to admin IPs or add auth
        # allow 10.0.0.0/8; deny all;
        proxy_pass http://minio:9001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static assets with caching
    location /_next/static/ {
        proxy_pass http://nextjs;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Public uploads/assets
    location /uploads/ {
        proxy_pass http://nextjs;
        proxy_cache_valid 200 1d;
        add_header Cache-Control "public, max-age=86400";
    }
}
