# Development Nginx Configuration for InstantCap
# HTTP only, no TLS. Keep browser CORS limited to the explicit storage route below.

server {
    listen 80;
    server_name localhost instantcap.local;

    # Security headers (dev-friendly)
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # Health check endpoint (direct, no proxy)
    location = /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Frontend - Next.js (with hot reload support)
    location / {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # WebSocket support for Next.js hot reload
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # API Routes - Next.js API handlers
    location /api/ {
        proxy_pass http://nextjs;

        # Larger body for file uploads
        client_max_body_size 500M;

        # Longer timeout for processing endpoints
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Internal worker endpoints (not exposed to browser)
    # These are accessed via Next.js API routes only
    location /internal/asr/ {
        internal;
        proxy_pass http://asr_worker/;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /internal/tts/ {
        internal;
        proxy_pass http://tts_worker/;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /internal/ai/ {
        internal;
        proxy_pass http://ai_worker/;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /internal/render/ {
        internal;
        proxy_pass http://render_worker/;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # S3-compatible object storage API (dev only) — supports direct browser uploads via presigned URLs
    # Bucket-level PutBucketCors is unsupported by this MinIO image. Direct browser
    # uploads use the restricted MINIO_API_CORS_ALLOW_ORIGIN setting and host port
    # 19002. This proxy route also applies an explicit origin policy, but presigned
    # URLs must be signed for the endpoint/path they use; never rewrite signed URLs.
    location /s3/ {
        # Handle CORS preflight - restrict to APP_URL (localhost:3000)
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "http://localhost:3000";
            add_header Access-Control-Allow-Methods "GET, PUT, POST, DELETE, HEAD, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Content-Length, Content-MD5, X-Amz-*, X-Requested-With";
            add_header Access-Control-Max-Age 3600;
            add_header Access-Control-Expose-Headers "ETag, Content-Length, Content-Type";
            add_header Access-Control-Allow-Credentials "true";
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        # Strip /s3 prefix when proxying to MinIO (MinIO expects /bucket/key)
        rewrite ^/s3/(.*) /$1 break;
        proxy_pass http://minio:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Enforce CORS headers (MinIO's permissive CORS is hidden)
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        add_header Access-Control-Allow-Origin "http://localhost:3000";
        add_header Access-Control-Allow-Methods "GET, PUT, POST, DELETE, HEAD, OPTIONS";
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Content-Length, Content-MD5, X-Amz-*, X-Requested-With";
        add_header Access-Control-Expose-Headers "ETag, Content-Length, Content-Type";
        add_header Access-Control-Allow-Credentials "true";

        # Larger body for direct uploads
        client_max_body_size 2G;
        proxy_request_buffering off;
    }

    # Static assets with caching
    location /_next/static/ {
        proxy_pass http://nextjs;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Public uploads/assets
    location /uploads/ {
        proxy_pass http://nextjs;
        proxy_cache_valid 200 1d;
        add_header Cache-Control "public, max-age=86400";
    }
}
